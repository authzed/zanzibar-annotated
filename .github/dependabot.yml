version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      github-actions:
        patterns: ["*"]

  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      npm:
        patterns: ["*"]
    ignore:
      # jsdom 27+ require()s ESM-only dependencies, which Vercel's runtime
      # rejects with ERR_REQUIRE_ESM, breaking selection permalinks.
      - dependency-name: "jsdom"
        versions: [">=27.0.0"]
